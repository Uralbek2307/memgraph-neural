services:
  - type: web
    name: memgraph-neural
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /tmp/memgraph-data
      - key: NODE_VERSION
        value: 24.11.0
      - key: ALLOW_LOCAL_DEMO
        value: "0"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
