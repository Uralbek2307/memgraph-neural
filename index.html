function friendsPage(){const incoming=state.friends.requests.filter(r=>r.recipient===me.id),outgoing=state.friends.requests.filter(r=>r.sender===me.id);return `${heading('friends','friendhint',btn('addfriend','addfriend','primary'))}${incoming.length?`<section class="card" style="margin-bottom:22px"><div class="cardhead"><h2>${t('incoming')} <span class="pill">${incoming.length}</span></h2></div>${incoming.map(r=>`<div class="rowitem">${avatar(r.name)}<div class="grow"><h3>${esc(r.name)}</h3><p>@${esc(r.username)}</p></div>${btn('accept','acceptfriend','primary',`data-id="${r.sender}"`)}${btn('decline','declinefriend','ghost',`data-id="${r.sender}"`)}</div>`).join('')}</section>`:''}<div class="grid3">${friends().map(f=>`<article class="card pad"><div class="between">${avatar(f.name,'big')}${pill('friend','green')}</div><h2 style="margin-top:17px">${esc(f.name)}</h2><p class="small">@${esc(f.username)}</p><p class="small" style="margin:10px 0 20px">${esc(f.bio||'')}</p><div class="row wrap">${btn('chats','dm','primary',`data-id="${f.id}"`)}${btn('more','friendoptions','ghost',`data-id="${f.id}"`)}</div></article>`).join('')}</div>${!friends().length?`<section class="card">${empty('emptyfriends','emptyfriendsText',btn('addfriend','addfriend','primary'),'friends')}</section>`:''}${outgoing.length?`<section class="card" style="margin-top:22px"><div class="cardhead"><h2>${t('outgoing')}</h2></div>${outgoing.map(r=>`<div class="rowitem">${avatar(r.name)}<div class="grow"><h3>${esc(r.name)}</h3><p>@${esc(r.username)} · ${t('pending')}</p></div>${btn('cancelrequest','removefriend','ghost',`data-id="${r.recipient}"`)}</div>`).join('')}</section>`:''}${state.friends.blocked.length?`<section class="card" style="margin-top:22px"><div class="cardhead"><h2>${t('blocked')}</h2></div>${state.friends.blocked.map(f=>`<div class="rowitem"><div class="grow"><h3>${esc(f.name)}</h3><p>@${esc(f.username)}</p></div>${btn('unblock','unblock','ghost',`data-id="${f.id}"`)}</div>`).join('')}</section>`:''}`}
function groupsPage(){return `${heading('groups','groupprivacy',btn('newgroup','newgroup','primary'))}<div class="grid3">${groups().map(r=>`<article class="card groupcard"><div class="between"><span class="groupicon">${ic('groups')}</span>${pill(r.status==='invited'?'invited':r.role)}</div><h2 style="margin-top:20px">${esc(r.name)}</h2><p>${esc(r.description||t('groupprivacy'))}</p>${r.status==='invited'?`<div class="notice small" style="margin-bottom:15px">${t('groupHistory')}</div><div class="row">${btn('accept','acceptgroup','primary',`data-id="${r.id}"`)}${btn('decline','declinegroup','ghost',`data-id="${r.id}"`)}</div>`:`<div class="between"><div class="avatars">${r.members.filter(m=>m.status==='active').slice(0,4).map(m=>avatar(m.name)).join('')}</div><small class="muted">${r.members.filter(m=>m.status==='active').length} ${t('members')}</small></div><div class="row" style="margin-top:22px">${btn('chats','openroom','primary',`data-id="${r.id}"`)}${btn('members','managegroup','',`data-id="${r.id}"`)}</div>`}</article>`).join('')}</div>${groups().length?'':`<section class="card">${empty('emptygroups','emptygroupsText',btn('newgroup','newgroup','primary'),'groups')}</section>`}`}
function chatsPage(){const rooms=state.rooms.filter(r=>r.status==='active'),r=room(currentRoom);return `${heading('chats','',btn('newchat','newchat','primary'))}<section class="card message-layout ${r?'hasroom':''}"><aside class="conversationlist" aria-label="${t('chats')}">${rooms.map(r=>`<button class="conversation ${r.id===currentRoom?'active':''}" data-act="openroom" data-id="${r.id}">${r.type==='group'?`<span class="groupicon">${ic('groups')}</span>`:avatar(r.name)}<div class="grow"><div class="between"><h3>${esc(r.name)}</h3>${r.unread?`<span class="badge">${r.unread}</span>`:''}</div><p>${esc(r.last_message?.body||t('emptychat'))}</p></div></button>`).join('')||empty('emptychat','emptychatText','','chats')}</aside><section class="thread">${r?`<div class="threadhead"><button class="btn iconbtn ghost mobile" data-act="backchat" aria-label="${t('back')}">←</button>${avatar(r.name)}<div class="grow"><h3>${esc(r.name)}</h3><p class="tiny">${r.type==='group'?r.members.filter(m=>m.status==='active').length+' '+t('members'):t('friend')}</p></div>${r.type==='group'?btn('members','managegroup','ghost',`data-id="${r.id}"`):''}</div><div class="messages" id="messages" aria-live="polite">${messageHtml()}</div><div class="chatcompose"><div id="attachmentlabel">${chatFile?`<div class="row small" style="margin-bottom:10px">${ic('attach')}${esc(file(chatFile)?.name)}<button class="link" data-act="removeattachment">×</button></div>`:''}</div><form id="messageform"><button class="btn iconbtn ghost" type="button" data-act="attach" aria-label="${t('attach')}">${ic('attach')}</button><label class="sr" for="chattext">${t('typeMessage')}</label><textarea id="chattext" name="body" maxlength="5000" placeholder="${t('typeMessage')}">${esc(chatDraft)}</textarea><button class="btn primary" aria-label="${t('send')}">${ic('send')}</button></form></div>`:`<div class="chatplaceholder">${empty('emptychat','emptychatText',btn('newchat','newchat','primary'),'chats')}</div>`}</section></section>`}
function messageHtml(){const r=room(currentRoom);return messages.map(m=>{const mine=m.sender===me.id,read=mine&&r?.members.some(u=>u.id!==me.id&&u.last_read>=m.created);return `<article class="message ${mine?'mine':''}">${avatar(m.name)}<div><div class="tiny muted" style="margin-bottom:4px">${esc(m.name)}</div><div class="bubble">${esc(m.body)}${m.file?`<button class="attachment" data-act="preview" data-id="${m.file.id}">${ic('files')}<span>${esc(m.file.name)}</span>↗</button>`:m.file_id?`<span class="tiny muted">${t('notavailable')}</span>`:''}</div><div class="msgmeta"><span>${time(m.created)}</span>${mine?`<span class="readstate">${t(read?'read':'sent')}</span>`:''}<button class="link" data-act="savemessage" data-id="${m.id}">${t('tosave')}</button></div></div></article>`}).join('')||`<div class="empty"><p>${t('emptychatText')}</p></div>`}
async function openRoom(rid){currentRoom=rid;chatDraft='';chatFile=null;messages=await api('/rooms/'+rid+'/messages');await api('/rooms/'+rid+'/read','POST',{});await refresh(false);navigate('chats');scrollMessages()}
function scrollMessages(){const el=document.getElementById('messages');if(el)el.scrollTop=el.scrollHeight}
function projectsPage(){if(currentProject&&project(currentProject))return projectPage();return `${heading('projects','emptyprojectText',btn('newproject','newproject','primary'))}<div class="between" style="margin-bottom:20px"><label class="row"><input type="checkbox" id="showarchived" ${showArchived?'checked':''}>${t('showarchived')}</label>${btn('sample','sample','soft')}</div><div class="grid3">${state.projects.filter(p=>!p.archived||showArchived).map(p=>`<article class="card projectcard"><div class="between"><span class="groupicon" style="${p.color==='green'?'background:var(--green);color:#428965':p.color==='orange'?'background:var(--orange);color:#b98b46':''}">${ic('projects')}</span>${pill(p.archived?'archived':'project')}</div><h2>${esc(p.name)}</h2><p>${esc(p.goal)}</p><div class="row muted small"><span>${state.files.filter(f=>f.project_id===p.id).length} ${t('files')}</span><span>· ${state.tasks.filter(t=>t.project_id===p.id&&!t.done).length} ${t('tasks')}</span></div><div class="row">${btn('preview','openproject','primary',`data-id="${p.id}"`)}${btn('rename','editproject','ghost',`data-id="${p.id}"`)}</div></article>`).join('')}</div>${!state.projects.length?`<section class="card">${empty('emptyproject','emptyprojectText',btn('newproject','newproject','primary'),'projects')}</section>`:''}`}
function projectPage(){const p=project(currentProject),fs=state.files.filter(f=>f.project_id===p.id),tasks=state.tasks.filter(t=>t.project_id===p.id),ds=state.decisions.filter(d=>d.project_id===p.id&&(!asof||d.created.slice(0,10)<=asof));return `<button class="link" data-act="backprojects" style="margin-bottom:18px">← ${t('projects')}</button><div class="pagehead between"><div><h1>${esc(p.name)}</h1><p>${esc(p.goal)}</p></div>${btn('rename','editproject','',`data-id="${p.id}"`)}</div><div class="tabs">${['files','tasks','decisions','graph','brief'].map(k=>`<button class="${projectTab===k?'active':''}" data-act="projecttab" data-value="${k}">${t(k)}</button>`).join('')}</div>${projectTab==='files'?`<div class="between sectiontitle"><h2>${t('projectfiles')}</h2>${btn('upload','upload','primary',`data-project="${p.id}"`)}</div><section class="card filelist">${fs.map(f=>fileRow(f)).join('')||empty('emptyfiles','emptyfilesText')}</section>`:projectTab==='tasks'?`<div class="between sectiontitle"><h2>${t('tasks')}</h2>${btn('newtask','newtask','primary',`data-project="${p.id}"`)}</div><section class="card">${tasks.map(taskRow).join('')||empty('emptytasks','emptytasksText','','tasks')}</section>`:projectTab==='decisions'?`<div class="filters"><label>${t('asof')}<input id="asof" type="date" value="${asof}"></label><div class="grow"></div>${btn('newdecision','newdecision','primary',`data-project="${p.id}"`)}</div><div class="timeline">${ds.map(d=>decisionCard(d,ds)).join('')||empty('none','questionsText','','decisions')}</div>`:projectTab==='graph'?graphHtml(fs,ds,tasks):briefHtml(p,ds,tasks)}`}
function taskRow(x){return `<div class="taskrow ${x.done?'done':''}"><input type="checkbox" data-task="${x.id}" ${x.done?'checked':''} aria-label="${t('done')}: ${esc(x.title)}"><div class="grow"><h3>${esc(x.title)}</h3><p class="tiny" style="margin-top:6px">${esc(x.assignee||me.name)} ${x.due?' · '+date(x.due):''}${x.done?' · '+t('done'):''}</p>${x.proof?`<p class="tiny">${esc(x.proof)}</p>`:''}${sourceButton(x)}</div></div>`}
function sourceButton(x){return x.source_file?`<button class="link tiny" data-act="preview" data-id="${x.source_file}" style="margin-top:7px">${ic('link')} ${t('sourceFile')}</button>`:x.source_message?`<button class="link tiny" data-act="messagesource" data-id="${x.source_message}" style="margin-top:7px">${ic('link')} ${t('sourceMessage')}</button>`:`<span class="tiny muted" style="display:block;margin-top:7px">${t('unlinked')}</span>`}
function decisionCard(d,ds){return `<article class="card pad"><div class="between">${pill(ds.some(x=>x.previous_id===d.id)?'superseded':'recorded',ds.some(x=>x.previous_id===d.id)?'orange':'')}<span class="tiny muted">${date(d.created)}</span></div><h3 style="margin:14px 0 8px">${esc(d.statement)}</h3><p class="small">${esc(d.rationale)}</p>${sourceButton(d)}</article>`}
function graphHtml(fs,ds,ts){const nodes=[{id:'center',name:project(currentProject).name,type:'project'},...fs.map(f=>({id:f.id,name:f.name,type:'file'})),...ds.map(d=>({id:d.id,name:d.statement,type:'decision',source:d.source_file})),...ts.map(t=>({id:t.id,name:t.title,type:'task',source:t.source_file}))];const positions={center:[400,170]};nodes.slice(1).forEach((n,i)=>{const a=i/(nodes.length-1)*Math.PI*2;positions[n.id]=[400+Math.cos(a)*280,170+Math.sin(a)*120]});return `<section class="card"><div class="cardhead between"><h2>${t('graph')}</h2><div class="row"><button class="btn iconbtn" data-act="zoomout" aria-label="${t('zoomOut')}">−</button><button class="btn iconbtn" data-act="zoomin" aria-label="${t('zoomIn')}">+</button>${btn('fit','fit')}</div></div><div class="graphpane"><svg viewBox="0 0 800 340" aria-label="${t('graph')}"><g transform="translate(${400*(1-graphZoom)} ${170*(1-graphZoom)}) scale(${graphZoom})">${nodes.slice(1).map(n=>{const target=positions[n.source]||positions.center;return `<line x1="${positions[n.id][0]}" y1="${positions[n.id][1]}" x2="${target[0]}" y2="${target[1]}" stroke="var(--line)" stroke-width="2"/>`}).join('')}${nodes.map(n=>`<g class="graphnode" tabindex="0" role="button" data-act="graphnode" data-id="${n.id}" data-type="${n.type}" aria-label="${esc(n.name)}" transform="translate(${positions[n.id][0]} ${positions[n.id][1]})"><circle r="${n.type==='project'?26:18}" fill="${n.type==='project'?'#bfa4f3':n.type==='file'?'#d8ccef':n.type==='task'?'#c4e2cf':'#f1dab7'}"/><text y="4" text-anchor="middle" style="fill:#47385c">${n.type==='project'?'M':'◇'}</text><text y="38" text-anchor="middle">${esc(n.name.slice(0,24))}${n.name.length>24?'…':''}</text></g>`).join('')}</g></svg></div><div class="pad"><h3>${t('list')}</h3>${nodes.slice(1).map(n=>`<button class="btn ghost" data-act="graphnode" data-id="${n.id}" data-type="${n.type}">${esc(n.name)}</button>`).join('')}</div></section>`}
function briefHtml(p,ds,ts){return `<section class="card pad"><div class="between"><h2>${t('brief')}</h2>${btn('exportBrief','exportbrief')}</div><p class="small" style="margin:12px 0 22px">${t('nosummary')}</p><div class="grid2"><label>${t('meetingdate')}<input id="briefdate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>${t('attendees')}<input id="briefattendees" placeholder="${t('name')}"></label></div><h3 style="margin:24px 0 15px">${t('decisions')}</h3>${ds.map(d=>`<div class="rowitem"><div><h3>${esc(d.statement)}</h3><p>${esc(d.rationale)}</p>${sourceButton(d)}</div></div>`).join('')||`<p>${t('none')}</p>`}<h3 style="margin:24px 0 10px">${t('openTasks')}</h3>${ts.filter(t=>!t.done).map(taskRow).join('')||`<p>${t('none')}</p>`}<div class="notice" style="margin-top:24px"><strong>${t('questions')}</strong><p style="margin-top:7px">${t('questionsText')}</p></div></section>`}
function activityPage(){return `${heading('activity','activityhint',btn('markread','markread'))}<section class="card">${state.notifications.map(n=>`<div class="rowitem"><span class="activitydot" style="opacity:${n.seen?.3:1}"></span><div class="grow"><h3>${esc(n.actor_name||'')} · ${t(n.kind)}</h3><p>${date(n.created)} · ${time(n.created)}</p></div><button class="btn ghost" data-act="opennotification" data-kind="${n.kind}" data-id="${n.ref}">${t('preview')} ↗</button></div>`).join('')||empty('emptyactivity','activityhint','','activity')}</section>`}
function settingsPage(){return `${heading('settings','privatehint')}<div class="grid2"><div class="stack"><section class="card pad"><h2>${t('profile')}</h2><form id="profileform" class="stack" style="margin-top:22px"><div class="row">${avatar(me.name,'big')}<div><h3>${esc(me.name)}</h3><p class="small">@${esc(me.username)}</p></div></div><label>${t('name')}<input name="name" value="${esc(me.name)}" required maxlength="80"></label><label>${t('bio')}<textarea name="bio" maxlength="300">${esc(me.bio)}</textarea></label><button class="btn primary">${t('save')}</button></form></section><section class="card pad"><h2>${t('security')}</h2><div class="settingsrow"><div><h3>${t('password')}</h3><p>${t('passwordhint')}</p></div>${btn('changepassword','password')}</div><div class="settingsrow"><div><h3>${t('sessions')}</h3><p>${t('revokeSession')}</p></div>${btn('preview','sessions')}</div><div class="notice" style="margin-top:18px">${t('emailhint')}</div></section></div><div class="stack" style="align-content:start"><section class="card pad"><div class="between"><h2 class="row">${ic('drive')} Google Drive</h2>${pill(config.drive?.connected?'connected':'disconnected',config.drive?.connected?'green':'orange')}</div><p class="small" style="margin:15px 0">${t('driveText')}</p><p class="small" style="margin-bottom:17px">${t('drivehint')}</p><div class="row wrap">${config.drive?.connected?`${btn('drivefiles','drivefiles','primary')}${btn('disconnect','disconnectdrive')}`:btn('connect','connectdrive','primary')}</div>${!config.drive?.configured?`<div class="notice orange" style="margin-top:18px"><strong>${t('driveSetup')}</strong><p style="margin-top:7px">${t('driveSetupText')}</p></div>`:''}<p class="tiny" style="margin-top:14px">${t('syncmanual')}</p></section><section class="card pad"><h2>${t('appearance')}</h2><div class="settingsrow"><h3>${t('language')}</h3>${language()}</div><div class="settingsrow"><label for="theme">${t('appearance')}</label><select id="theme">${['light','dark','system'].map(v=>`<option value="${v}" ${theme===v?'selected':''}>${t(v)}</option>`).join('')}</select></div></section><section class="card pad"><h2>${t('exportall')}</h2><p class="small" style="margin:12px 0 19px">${t('exporthint')}</p>${btn('export','exportall')}<div class="divider"></div><h3>${t('sample')}</h3><p class="small" style="margin:8px 0 17px">${t('samplehint')}</p>${btn('sample','sample','soft')}</section></div></div>`}
let trashFiles=[];function trashPage(){return `${heading('trash','trashhint')}<section class="card filelist">${trashFiles.map(f=>`<div class="rowitem"><span class="fileicon">${ic('files')}</span><div class="grow"><h3>${esc(f.name)}</h3><p>${date(f.trashed)} · ${bytes(f.size)}</p></div><div class="row wrap">${btn('restore','restore','',`data-id="${f.id}"`)}${btn('purge','purge','danger',`data-id="${f.id}"`)}</div></div>`).join('')||empty('none','trashhint','','trash')}</section>`}
function searchPage(){return `${heading('searchTitle','searchHint')}<form class="searchbox" id="searchform"><label class="sr" for="searchq">${t('search')}</label><input id="searchq" name="query" value="${esc(query)}" required placeholder="${t('searchPlaceholder')}"><button class="btn primary">${ic('search')}${t('search')}</button></form><div class="filters"><label>${t('project')}<select id="searchproject">${projectOptions(searchProject,true)}</select></label><label>${t('asof')}<input type="date" id="searchbefore" value="${searchBefore}"></label></div>${query?`<section class="card"><div class="cardhead between"><h2>${t('results')} <span class="pill">${hits.length}</span></h2>${hits.length?btn('saveanswer','saveanswer'):''}</div>${hits.map((r,i)=>`<article class="pad" style="border-top:1px solid var(--line)"><div class="between"><h3>${esc(r.name)}</h3><span class="tiny muted">${date(r.created)}</span></div><blockquote class="quote">${esc(r.passage)}</blockquote><button class="link" data-act="citation" data-index="${i}">[${i+1}] ${t('source')} ↗</button><span class="tiny muted" style="margin-left:15px">${t('original')}</span></article>`).join('')||empty('noevidence','noevidenceText','','search')}</section>`:''}<section class="card" style="margin-top:22px"><div class="cardhead"><h2>${t('savedanswers')}</h2></div>${state.answers.map(a=>`<button class="rowitem" style="width:100%;background:transparent;text-align:left;border-top:0;border-left:0;border-right:0" data-act="savedsearch" data-query="${esc(a.query)}">${ic('search')}<span class="grow">${esc(a.query)}</span>↗</button>`).join('')||`<div class="pad muted small">${t('none')}</div>`}</section>`}
