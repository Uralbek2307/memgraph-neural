<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memgraph · Admin</title><link rel="stylesheet" href="/cyber.css"><style>body{margin:0;padding:30px;font-family:Segoe UI,sans-serif}main{max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}a{color:#c7acff}form{display:grid;gap:15px}input,select,button{padding:12px;font:inherit}#login{max-width:380px;margin:70px auto;padding:30px;border:1px solid #58406e;border-radius:15px}#panel[hidden],#login[hidden]{display:none}.toolbar{display:flex;gap:12px;margin-bottom:20px}.toolbar input{flex:1;min-width:100px}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px;border-bottom:1px solid #30243f}td small{display:block;margin-top:6px;color:#a99aba}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px}#message{min-height:25px;color:#f7a8da}.audit{margin-top:30px}li{margin:10px 0;color:#bfaacf}</style></head>
<body><main><header><div><small>MEMGRAPH / CONTROL CENTER</small><h1>Admin panel</h1></div><a href="/">Foydalanuvchi sayti ↗</a></header><p id="message" role="status"></p><form id="login"><h2>Admin kirishi</h2><label>Admin nomi<input name="username" autocomplete="username" required></label><label>Parol<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary">Kirish</button></form><section id="panel" hidden><div class="toolbar"><input id="search" aria-label="Foydalanuvchini qidirish" placeholder="Ism, username yoki email"><button id="find" class="btn">Qidirish</button><button id="logout" class="btn">Chiqish</button></div><p id="count"></p><div class="table"><table><thead><tr><th>Foydalanuvchi</th><th>Holat va tarif</th><th>Foydalanish</th><th>Boshqaruv</th></tr></thead><tbody id="users"></tbody></table></div><div class="toolbar"><button id="prev" class="btn">← Oldingi</button><button id="next" class="btn">Keyingi →</button></div><section class="audit"><h2>Oxirgi admin amallari</h2><ul id="audit"></ul></section></section></main>
<script>
let csrf='',page=0,total=0;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const passwordInput=document.querySelector('#login input[name="password"]');
const passwordRow=document.createElement('span');passwordRow.style.cssText='display:flex;align-items:center;gap:8px;margin-top:6px';passwordInput.before(passwordRow);passwordRow.append(passwordInput);passwordInput.style.cssText='flex:1;min-width:0;width:100%;box-sizing:border-box';
const eye=document.createElement('button');eye.type='button';eye.className='btn';eye.setAttribute('aria-label','Parolni ko‘rsatish');eye.setAttribute('aria-pressed','false');eye.title='Parolni ko‘rsatish';eye.style.cssText='min-width:46px;display:grid;place-items:center';
const eyeIcon=visible=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>${visible?'<path d="m3 3 18 18"/>':''}</svg>`;
eye.innerHTML=eyeIcon(false);passwordRow.append(eye);
function hidePassword(){passwordInput.type='password';eye.innerHTML=eyeIcon(false);eye.setAttribute('aria-label','Parolni ko‘rsatish');eye.title='Parolni ko‘rsatish';eye.setAttribute('aria-pressed','false')}
eye.onclick=()=>{const visible=passwordInput.type==='password';passwordInput.type=visible?'text':'password';eye.innerHTML=eyeIcon(visible);eye.setAttribute('aria-label',visible?'Parolni yashirish':'Parolni ko‘rsatish');eye.title=visible?'Parolni yashirish':'Parolni ko‘rsatish';eye.setAttribute('aria-pressed',String(visible))};
$('login').addEventListener('submit',hidePassword);document.addEventListener('visibilitychange',()=>{if(document.hidden)hidePassword()});
const errors={admin_setup:'Admin hali sozlanmagan. Render Environment ichida ADMIN_USERNAME va kamida 16 belgili ADMIN_PASSWORD belgilang.',login_failed:'Admin nomi yoki parol noto‘g‘ri.',login_required:'Admin sifatida qayta kiring.',csrf:'Sahifani yangilab qayta kiring.',rate_limit:'Urinishlar ko‘paydi. 15 daqiqadan so‘ng qayta urining.'};
async function api(path,method='GET',data){const r=await fetch('/api/admin'+path,{method,headers:method==='GET'?{}:{'Content-Type':'application/json','x-csrf-token':csrf},body:data===undefined?undefined:JSON.stringify(data)});const b=await r.json();if(!r.ok){if(r.status===401){$('login').hidden=false;$('panel').hidden=true}throw Error(errors[b.error]||'Amal bajarilmadi: '+b.error)}return b}
async function load(){const data=await api('/users?'+new URLSearchParams({q:$('search').value,page}));total=data.total;$('count').textContent=`${total} ta foydalanuvchi · ${page+1}-sahifa`;$('users').innerHTML=data.users.map(u=>`<tr><td>${esc(u.name)}<small>@${esc(u.username)} · ${esc(u.email)}</small><small>${esc(u.created.slice(0,10))}</small></td><td>${u.suspended?'Bloklangan':'Faol'}<small>${esc(u.billing.name)}${u.billing.expiresAt?' · '+esc(new Date(u.billing.expiresAt).toLocaleDateString('uz-UZ')):''}</small></td><td>${(u.billing.usage.storageBytes/1048576).toFixed(1)} MB<small>${u.billing.usage.aiQueries} AI / oy · ${u.billing.usage.projects} loyiha</small></td><td><div class="actions"><select aria-label="Tarif" data-user="${u.id}">${['free','monthly','premium','annual'].map(p=>`<option value="${p}" ${u.billing.id===p?'selected':''}>${esc(p)}</option>`).join('')}</select><button class="btn" data-id="${u.id}" data-action="plan">Tarif berish</button><button class="btn" data-id="${u.id}" data-action="${u.suspended?'restore':'suspend'}">${u.suspended?'Faollashtirish':'Bloklash'}</button><button class="btn" data-id="${u.id}" data-action="revoke_sessions">Sessiyalarni yopish</button></div></td></tr>`).join('')||'<tr><td colspan="4">Foydalanuvchi topilmadi</td></tr>';$('audit').innerHTML=data.audit.map(a=>`<li>${esc(a.created)} · ${esc(a.target)} · ${esc(a.action)}</li>`).join('');$('prev').disabled=page===0;$('next').disabled=(page+1)*30>=total}
async function attempt(fn){$('message').textContent='';try{await fn()}catch(e){$('message').textContent=e.message}}
$('login').onsubmit=e=>{e.preventDefault();attempt(async()=>{const data=await api('/login','POST',Object.fromEntries(new FormData(e.target)));csrf=data.csrf;e.target.reset();$('login').hidden=true;$('panel').hidden=false;await load()})};
$('find').onclick=()=>attempt(async()=>{page=0;await load()});$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};$('prev').onclick=()=>attempt(async()=>{page--;await load()});$('next').onclick=()=>attempt(async()=>{page++;await load()});
$('logout').onclick=()=>attempt(async()=>{await api('/logout','POST',{});csrf='';$('users').innerHTML='';$('audit').innerHTML='';$('login').hidden=false;$('panel').hidden=true});
$('users').onclick=e=>{const button=e.target.closest('[data-action]');if(!button)return;attempt(async()=>{const action=button.dataset.action,id=button.dataset.id,plan=document.querySelector(`select[data-user="${id}"]`).value;if(!confirm('Ushbu foydalanuvchi uchun amalni tasdiqlaysizmi?'))return;button.disabled=true;try{await api('/users/'+id,'PATCH',{action,plan});await load();$('message').textContent='O‘zgarish saqlandi.'}finally{button.disabled=false}})};
(async()=>{try{const data=await api('/me');csrf=data.csrf;$('login').hidden=true;$('panel').hidden=false;await load()}catch(e){if(e.message!==errors.login_required)$('message').textContent=e.message}})();
</script></body></html>
